<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Enforce HTTPS and upgrade all insecure asset/API requests -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <script>
      (function() {
        if (typeof window !== 'undefined' && window.location) {
          var host = window.location.hostname;
          var isLocal = host === 'localhost' || host === '127.0.0.1' || host.endsWith('.local');
          if (window.location.protocol === 'http:' && !isLocal) {
            window.location.replace('https:' + window.location.href.substring(window.location.protocol.length));
          }
        }
      })();
    </script>
    <title>SVNHS SHS Dept - File & Asset Repository Platform</title>
    <meta name="description" content="High-performance repository platform for SVNHS SHS Dept with personalized faculty workspaces, surname-organized admin directories, versioning, folder hierarchies, storage telemetry, and announcements." />
    <meta property="og:title" content="SVNHS SHS Dept - File & Asset Repository Platform" />
    <meta property="og:description" content="High-performance repository platform for SVNHS SHS Dept with personalized faculty workspaces, surname-organized admin directories, versioning, folder hierarchies, storage telemetry, and announcements." />
    <meta property="og:type" content="website" />
    <meta name="application-name" content="SVNHS SHS Repository" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
